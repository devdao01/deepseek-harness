# =============================================================================
# MTIL AI — nginx on 192.168.8.56 (the Odoo host)
#
# Topology (one harness process on 192.168.8.68 serves BOTH frontends):
#
#   https://mtilai.mtil.mtil.vn        -> harness :3080 (original frontend)
#   https://mtil.mtil.vn/mtilai2/      -> custom SPA dist (static) + /api proxy
#   https://mtil.mtil.vn               -> Odoo 17 (existing; the get_config_v2
#                                         login gate answers under /api/mtil/)
#
# Install: copy into /etc/nginx/conf.d/mtil-ai.conf (or include it), fill the
# ssl_certificate paths, then `nginx -t && systemctl reload nginx`.
# If a server block for mtil.mtil.vn already exists for Odoo, copy ONLY the
# /mtilai2/ location blocks below into that existing block.
#
# -----------------------------------------------------------------------------
# RUN THE HARNESS on 192.168.8.68 (checkout of the fork, branch mtil-v0.1.2.alpha):
#
#   pnpm install
#   pnpm run build          # REQUIRED after every code pull (client bundles
#                           # do not rebuild themselves; stale ones break RPC)
#
#   # Once: install the bind overlay into the web profile's own patch layer
#   # (created as an empty [] on first boot; merge by hand if you already
#   # customized it). Applied automatically on every later boot.
#   mkdir -p ~/.dsh/profiles/web
#   cp apps/frontend/deploy/harness-web-lan.patch.yml ~/.dsh/profiles/web/cordis.patch.yml
#
#   tmux new -d -s dsh 'pnpm dsh --profile web --no-open \
#       --trusted-host mtilai.mtil.mtil.vn \
#       --trusted-host mtil.mtil.vn'
#   tmux capture-pane -p -t dsh | grep "dsh web:"   # copy the ?token=… value
#
#   (--patch <file> also works, but launcher flags must come BEFORE app flags:
#    dsh --profile web --patch <file> --no-open …)
#
#   The overlay binds 0.0.0.0 — firewall the port to this nginx host only:
#     ufw allow from 192.168.8.56 to any port 3080
#   The printed token authenticates browsers (open
#   https://<domain>/?token=… once per domain) AND the Odoo module
#   (Settings > MTIL Agent > API Token). It changes on every restart.
#
# -----------------------------------------------------------------------------
# BUILD THE SPA (inside the same checkout; deploy machine only needs dist/):
#
#   cd apps/frontend
#   pnpm install --ignore-workspace          # once
#   ./deploy/build-mtil.sh                   # build + stage into the npei_build
#                                            # tree (DEST=… overrides the target)
#   # or ship directly: rsync -av --delete dist/ root@192.168.8.56:/srv/mtilai2-www/mtilai2/
#   # Either way the CONTENT must land at /srv/mtilai2-www/mtilai2/ (the
#   # directory nginx's root resolves to /mtilai2/ below).
#
#   CONFIG_API_ODOO=/ = the Odoo login gate calls the SPA's own origin
#   (https://mtil.mtil.vn/api/mtil/get_config_v2) with the session_id cookie.
#   For a standalone SPA domain instead, build with
#   CONFIG_API_ODOO=https://mtil.mtil.vn and add a server block modeled on the
#   mtilai one plus the /mtilai2/-style SPA locations at /.
# =============================================================================

# WebSocket upgrade helper (http{} scope).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The single harness process.
upstream dsh_harness {
    server 192.168.8.68:3080;
}

# =============================================================================
# Original harness frontend: https://mtilai.mtil.mtil.vn
# =============================================================================
server {
    listen 80;
    server_name mtilai.mtil.mtil.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mtilai.mtil.mtil.vn;

    # ssl_certificate     /etc/letsencrypt/live/mtilai.mtil.mtil.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mtilai.mtil.mtil.vn/privkey.pem;

    # Everything — index, /api (incl. the /api/remote.mux WebSocket), /plugins —
    # is served by the harness itself.
    location / {
        proxy_pass http://dsh_harness;
        proxy_set_header Host $host;              # cookie authority + trust fence
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;                       # SSE (/plugins/events)
        proxy_read_timeout 1h;
        client_max_body_size 64m;                  # image attachments
    }
}

# =============================================================================
# Odoo + custom SPA under /mtilai2/: https://mtil.mtil.vn
# (Merge the /mtilai2/ blocks into the existing Odoo server block if one exists.)
# =============================================================================
server {
    listen 80;
    server_name mtil.mtil.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mtil.mtil.vn;

    # ssl_certificate     /etc/letsencrypt/live/mtil.mtil.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mtil.mtil.vn/privkey.pem;

    client_max_body_size 128m;

    # --- Custom SPA ----------------------------------------------------------
    # Session deep links (/mtilai2/s/<id>): the browser's speculative preload
    # scanner resolves the page's relative ./assets URLs under s/ before the
    # client-computed <base> applies; serve them from the real assets root.
    rewrite ^/mtilai2/s/assets/(.*)$ /mtilai2/assets/$1 last;

    # Static dist. rsync the build into /srv/mtilai2-www/mtilai2/ (the URI
    # prefix is part of the on-disk path so plain `root` works — no alias
    # try_files pitfalls). Unknown paths fall back to the SPA page.
    location /mtilai2/ {
        root /srv/mtilai2-www;
        index index.html;
        try_files $uri $uri/ /mtilai2/index.html;
    }

    # Harness API, prefix-stripped (incl. the remote.mux WebSocket + streaming).
    location /mtilai2/api/ {
        proxy_pass http://dsh_harness/api/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 64m;
    }

    # Dynamic client plugin bundles + sourcemaps + HMR SSE.
    location /mtilai2/plugins/ {
        proxy_pass http://dsh_harness/plugins/;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    # Harness token exchange bridge: /mtilai2/dsh-auth?token=… hits the harness
    # root so the dsh-auth cookie is minted for THIS domain; the 303 "/" is
    # rewritten back onto the SPA.
    location = /mtilai2/dsh-auth {
        proxy_pass http://dsh_harness/;
        proxy_set_header Host $host;
        proxy_redirect / /mtilai2/;
    }

    # --- Odoo (adjust ports to the docker mapping) ---------------------------
    # /api/mtil/get_config_v2 (the SPA login gate) is an Odoo/gate route and
    # rides these defaults.
    location /websocket {
        proxy_pass http://127.0.0.1:8072;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 720s;
    }
}
