# =============================================================================
# MTIL AI — nginx on 192.168.11.68, the harness host.
#
# One harness instance per company, each on 127.0.0.1:<port> under its own
# Linux user (systemd unit mtil-harness@<company>). This nginx is their only
# network face and picks the instance by the Host header the gateway
# 192.168.9.56 forwards unchanged:
#
#   <company Odoo domain>/mtilai2/  -> shared SPA dist + that company's harness
#   <company admin domain>/         -> that company's harness at the root
#                                      (Odoo Base URL, admin setup)
#
# Host -> port lines live in one file per company, written by
# apps/mtil-deploy/add-company.sh:
#   /etc/nginx/mtil/spa-hosts/<company>.map     e.g.  mtil.mtil.vn 3081;
#   /etc/nginx/mtil/admin-hosts/<company>.map   e.g.  mtilai.mtil.mtil.vn 3081;
# A Host found in neither map gets 404. Full procedure: docs/MTIL-DEPLOY.md.
#
# Install: copy to /etc/nginx/conf.d/mtil-harness.conf, then
#   sudo mkdir -p /etc/nginx/mtil/spa-hosts /etc/nginx/mtil/admin-hosts
#   sudo nginx -t && sudo systemctl reload nginx
# Firewall (ufw): port 80 only from the gateway:
#   sudo ufw allow from 192.168.9.56 to any port 80 proto tcp
# =============================================================================

# WebSocket upgrade helper (http{} scope). Delete this map if another file in
# conf.d already declares $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $host $mtil_spa_port {
    hostnames;
    default "";
    include /etc/nginx/mtil/spa-hosts/*.map;
}

map $host $mtil_admin_port {
    hostnames;
    default "";
    include /etc/nginx/mtil/admin-hosts/*.map;
}

server {
    listen 80;
    # Regex names rank after exact and wildcard names, so other virtual hosts
    # on this machine keep their own requests; the maps decide the rest.
    server_name ~^.+$;

    client_max_body_size 64m;

    # Session deep links (/mtilai2/s/<id>): the browser's preload scanner
    # resolves the page's relative ./assets URLs under s/ before the
    # client-computed <base> applies; serve them from the real assets root.
    rewrite ^/mtilai2/s/assets/(.*)$ /mtilai2/assets/$1 last;

    # Shared SPA dist written by apps/frontend/deploy/build-mtil.sh
    # (DEST=/var/www/mtilai2); one build serves every company's Odoo domain.
    location /mtilai2/ {
        if ($mtil_spa_port = "") { return 404; }
        alias /var/www/mtilai2/;
        index index.html;
        try_files $uri $uri/ /mtilai2/index.html;
    }

    # Harness API, prefix-stripped (includes the /api/remote.mux WebSocket and
    # streaming responses).
    location /mtilai2/api/ {
        if ($mtil_spa_port = "") { return 404; }
        rewrite ^/mtilai2(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:$mtil_spa_port;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Client plugin bundles, sourcemaps, and the HMR event stream.
    location /mtilai2/plugins/ {
        if ($mtil_spa_port = "") { return 404; }
        rewrite ^/mtilai2(/plugins/.*)$ $1 break;
        proxy_pass http://127.0.0.1:$mtil_spa_port;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Token exchange: /mtilai2/dsh-auth?token=… reaches the harness root, which
    # mints the dsh-auth cookie for this Host and answers 303 "./" (the browser
    # resolves it to /mtilai2/); proxy_redirect maps an absolute "/" answer the
    # same way.
    location = /mtilai2/dsh-auth {
        if ($mtil_spa_port = "") { return 404; }
        rewrite ^ / break;
        proxy_pass http://127.0.0.1:$mtil_spa_port;
        proxy_set_header Host $host;
        proxy_redirect / /mtilai2/;
    }

    # Admin domain: the company's harness at the root (Odoo Base URL and the
    # stock harness frontend for setup).
    location / {
        if ($mtil_admin_port = "") { return 404; }
        proxy_pass http://127.0.0.1:$mtil_admin_port;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
