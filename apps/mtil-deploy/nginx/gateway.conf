# =============================================================================
# MTIL AI — nginx on 192.168.9.56, the Internet gateway for every LAN server.
# http{}-level pieces plus one admin-domain server block per company.
#
# Each company has two names on this gateway:
#
#   https://<company Odoo domain>/          -> that company's Odoo (existing)
#   https://<company Odoo domain>/mtilai2/  -> 192.168.11.68 (SPA + harness),
#        admitted only for a signed-in MTIL User of THAT Odoo: the snippet
#        mtil-spa.locations asks the Odoo route GET /api/mtil/auth_check
#        before every request (nginx auth_request) and sends anonymous
#        browsers to /web/login
#   https://<company admin domain>/         -> 192.168.11.68, LAN-only:
#        that company's Odoo backend (Settings → MTIL → Base URL) and the
#        admin's setup UI
#
# Every hop keeps the browser Host header (`proxy_set_header Host $host`):
# nginx on 192.168.11.68 picks the company's harness by it, and the harness
# /api trust fence and the dsh-auth cookie are bound to it.
#
# Install:
#   nginx -V 2>&1 | grep -o http_auth_request_module   # must print the module
#   sudo cp gateway.conf /etc/nginx/conf.d/mtil-gateway.conf
#   sudo cp mtil-spa.locations /etc/nginx/snippets/mtil-spa.locations
#   sudo mkdir -p /var/cache/nginx/mtil_auth
# then, per company, edit its Odoo server block (two lines, below) and add its
# admin server block; finally `sudo nginx -t && sudo systemctl reload nginx`.
# Full procedure: docs/MTIL-DEPLOY.md.
# =============================================================================

# WebSocket upgrade helper. Delete this map if the gateway already declares
# $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A request without an Odoo session cookie is never cached as admitted.
map $cookie_session_id $mtil_auth_no_cache {
    ""      1;
    default 0;
}

# Odoo login verdicts, reused for 30 s per (domain, Odoo session); see
# mtil-spa.locations.
proxy_cache_path /var/cache/nginx/mtil_auth levels=1:2 keys_zone=mtil_auth:1m
                 max_size=16m inactive=5m use_temp_path=off;

upstream mtil_harness_host {
    server 192.168.11.68:80;
}

# -----------------------------------------------------------------------------
# Per company, in that company's EXISTING Odoo server block (the one whose
# `location /` proxies Odoo), add:
#
#   set $mtil_odoo http://<Odoo upstream of this block>;   # e.g. http://odoo_mtil
#   include snippets/mtil-spa.locations;
#
# $mtil_odoo is the same target the block's `location /` proxies to: an
# `upstream` name or ip:port needs nothing else; a host name additionally
# needs a `resolver` directive in that server block.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Per company: its admin domain, LAN-only. Copy this block once per company
# and change server_name, the certificate, and the allow list.
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name mtilai.mtil.mtil.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mtilai.mtil.mtil.vn;

    ssl_certificate     /etc/letsencrypt/live/mtilai.mtil.mtil.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtilai.mtil.mtil.vn/privkey.pem;

    # The company's Odoo server and the admins' machines; the Internet gets 403.
    allow 192.168.0.0/16;
    # allow <public IP of this company's Odoo when it runs outside the LAN>;
    deny all;

    location / {
        proxy_pass http://mtil_harness_host;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 64m;
    }
}
