# =============================================================================
# MTIL AI — nginx on 192.168.9.56, the Internet gateway for every LAN server.
#
# Terminates TLS and forwards to the per-server nginx over plain HTTP:
#
#   https://mtil.mtil.vn/mtilai2/   -> 192.168.11.68:80 (custom SPA + harness)
#   https://mtil.mtil.vn/           -> Odoo (unchanged; the SPA login gate
#                                      /api/mtil/get_config_v2 rides it)
#   https://mtilai.mtil.mtil.vn/    -> 192.168.11.68:80 (stock harness frontend)
#
# Every hop MUST keep the browser Host header (`proxy_set_header Host $host`):
# nginx on 192.168.11.68 picks its server block by it, and the harness /api
# trust fence and the dsh-auth cookie are bound to it. Every hop MUST pass the
# WebSocket upgrade and disable buffering for /mtilai2/api/.
#
# Merge the /mtilai2/ location into the existing mtil.mtil.vn server block
# (keep that block's Odoo locations as they are), then
#   sudo nginx -t && sudo systemctl reload nginx
# Full procedure: docs/MTIL-DEPLOY.md.
# =============================================================================

# WebSocket upgrade helper (http{} scope). Delete this map if the gateway
# already declares $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mtil_harness_host {
    server 192.168.11.68:80;
}

# -----------------------------------------------------------------------------
# mtil.mtil.vn: only the /mtilai2/ location is new. Paste it into the existing
# server block that already proxies Odoo.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name mtil.mtil.vn;

    # ssl_certificate     /etc/letsencrypt/live/mtil.mtil.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mtil.mtil.vn/privkey.pem;

    location /mtilai2/ {
        proxy_pass http://mtil_harness_host;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 64m;
    }

    # ... existing Odoo locations (/, /websocket, ...) stay here unchanged ...
}

# -----------------------------------------------------------------------------
# mtilai.mtil.mtil.vn: stock harness frontend (optional).
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name mtilai.mtil.mtil.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mtilai.mtil.mtil.vn;

    # ssl_certificate     /etc/letsencrypt/live/mtilai.mtil.mtil.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mtilai.mtil.mtil.vn/privkey.pem;

    location / {
        proxy_pass http://mtil_harness_host;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        client_max_body_size 64m;
    }
}
