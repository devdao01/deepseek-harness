# MTIL Chat AI — add-on to your EXISTING mtil nginx config
# =========================================================
# Your site already serves Odoo at `/` and its MTIL/Flask API at `/api`
# (get_config_v2, /api/mtil/*, and other /api/* routes). This adds the two NEW
# pieces on the SAME origin so the HttpOnly `dsh_ticket` cookie reaches the harness:
#   /api-harness/  -> harness (`dsh web`): RPC, /api/respond, the WebSocket downlinks
#                     (events.mux/host), the GET downloads. A SEPARATE prefix so it
#                     NEVER collides with your existing /api/* (Odoo/Flask). nginx
#                     strips /api-harness/ back to /api/ for the harness. It MUST
#                     match the SPA build's VITE_HARNESS_API_PATH=/api-harness and
#                     the ticket cookie's DSH_TICKET_COOKIE_PATH=/api-harness.
#   /mtilai2/      -> the SPA static build (apps/frontend/dist), built with
#                     BASE_PATH=/mtilai2/.
#
# Do NOT add a second `server {}` for this host — paste the pieces below into the
# server block you already have (the one serving Odoo `/` and `/api`).

# ---------------------------------------------------------------------------
# http {} context — put these beside your other `map` / `upstream` directives.
# (Skip the map if you already define $connection_upgrade for Odoo's websocket.)
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# Harness on the SAME host as nginx (loopback = safest: not network-exposed, no
# firewall). On a DIFFERENT host/VM, use that host's INTERNAL IP, e.g.
# `server 192.168.8.68:3080;`.
upstream harness { server 127.0.0.1:3080; }   # `dsh web`

# ---------------------------------------------------------------------------
# server {} context — add these locations INSIDE your existing
# `server { server_name mtil...; }` block, alongside Odoo `/` and `/api/`.
# ---------------------------------------------------------------------------

# Harness under a DISTINCT prefix so it never collides with your /api/* (Odoo/Flask).
# The trailing `/api/` on proxy_pass strips `/api-harness/` → the harness still
# sees its own /api/<method>, /api/events.mux, /api/respond, downloads.
location ^~ /api-harness/ {
    proxy_pass http://harness/api/;

    # Trust fence: the harness admits a browser request only when Origin equals
    # the Host authority AND that host is trusted. Forward the PUBLIC host and
    # leave Origin untouched so Origin===Host holds. You MUST also trust it:
    #   dsh web --trusted-host mtil.example.com
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket downlinks + long-lived SSE.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streams must not be buffered or timed out mid-turn.
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Image attachments ride the unary body; keep at/above the harness
    # `maxRequestBodyBytes`. Set on the server block if not already large.
    client_max_body_size 32m;
}

# SPA static build under /mtilai2/ (built with BASE_PATH=/mtilai2/, so its assets
# live at /mtilai2/assets/). The /api-harness and /api/mtil calls are root-absolute,
# so the subpath does not affect them.
location ^~ /mtilai2/assets/ {
    alias      /var/www/mtilai/dist/assets/;
    expires    30d;
    add_header Cache-Control "public, immutable";
}
location = /mtilai2/index.html {
    alias      /var/www/mtilai/dist/index.html;
    add_header Cache-Control "no-store";
}
location ^~ /mtilai2/ {
    alias     /var/www/mtilai/dist/;   # <-- copy apps/frontend/dist here
    try_files $uri /mtilai2/index.html;  # SPA client routes (/s/:id) -> index.html
}
