# MTIL Chat AI — add-on to your EXISTING mtil nginx config
# =========================================================
# Your site already proxies /api/mtil/ (MTIL API) and Odoo on this host. This
# only adds the two NEW pieces, which MUST stay on the SAME origin so the
# HttpOnly `dsh_ticket` cookie (Path=/api) reaches the harness:
#   /api/   -> harness (`dsh web`): RPC, /api/respond, the WebSocket downlinks
#             (events.mux/host), and the GET downloads. Longest-prefix keeps
#             your existing /api/mtil/ winning over this /api/ block.
#   <spa>   -> the SPA static build (apps/frontend/dist).
#
# Do NOT add a second `server {}` for this host — paste the pieces below into
# the server block you already have.

# ---------------------------------------------------------------------------
# http {} context — put these beside your other `map` / `upstream` directives.
# (Skip the map if you already define $connection_upgrade for Odoo's websocket.)
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
upstream harness { server 127.0.0.1:3080; }   # `dsh web`

# ---------------------------------------------------------------------------
# server {} context — add these locations INSIDE your existing
# `server { server_name mtil...; }` block, alongside /api/mtil/ and Odoo.
# ---------------------------------------------------------------------------

# Harness /api: RPC + /api/respond + WS downlinks + downloads.
location ^~ /api/ {
    proxy_pass http://harness;

    # Trust fence: the harness admits a browser request only when Origin equals
    # the Host authority AND that host is trusted. Forward the PUBLIC host and
    # leave Origin untouched so Origin===Host holds. You MUST also trust it:
    #   dsh web --trusted-host mtil.example.com
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket downlinks + long-lived SSE.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Streams must not be buffered or timed out mid-turn.
    proxy_buffering    off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Image attachments ride the unary body; keep at/above the harness
    # `maxRequestBodyBytes`. Set on the server block if not already large.
    client_max_body_size 32m;
}

# SPA static build (apps/frontend/dist).
#
# Served at root `/` below. If root is ALREADY taken by your MTIL/Odoo app,
# serve the SPA at a subpath instead — e.g. rebuild with `BASE_PATH=/mtilai/`
# and use `location /mtilai/ { alias /var/www/mtilai/; try_files $uri /mtilai/index.html; }`.
# The API calls are root-absolute (`/api/...`) regardless of the SPA path, so
# they still reach the harness. (A subpath also needs the router basename set;
# root needs nothing.)
location / {
    root  /var/www/mtilai;             # <-- copy apps/frontend/dist here
    index index.html;
    try_files $uri $uri/ /index.html;  # SPA client routes (/s/:id) -> index.html
}
location /assets/ {
    root       /var/www/mtilai;
    expires    30d;
    add_header Cache-Control "public, immutable";
}
location = /index.html {
    root       /var/www/mtilai;
    add_header Cache-Control "no-store";
}
