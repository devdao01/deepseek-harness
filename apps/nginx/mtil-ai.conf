# MTIL Chat AI — same-origin reverse proxy
# ==========================================
# One public origin ties four upstreams together so the browser's HttpOnly
# `dsh_ticket` cookie (set Path=/api by the MTIL API) reaches BOTH the MTIL API
# and the harness. Split any of them onto a different origin and the cookie
# stops flowing — per-user auth breaks.
#
# Routing (longest-prefix wins, so /api/mtil beats /api):
#   /api/mtil/  -> MTIL API (Flask): get_config_v2 (auth gate + ticket cookie),
#                 session_create (session.create + setAccess(creator)).
#   /api/       -> harness (`dsh web`): unary RPC, /api/respond, the two
#                 WebSocket downlinks (events.mux/host), and the GET downloads.
#   /           -> the SPA static build (apps/frontend `pnpm build` -> dist/).
#   /web /odoo /websocket /longpolling -> Odoo (login + management UI), OPTIONAL,
#                 only when the login that sets the MTIL session cookie is Odoo
#                 and must live on this same origin.
#
# Fill in the three upstream addresses and the two TLS paths, then reload nginx.

# WebSocket upgrade helper: "upgrade" when the client asked to upgrade, else "".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream mtil_api { server 127.0.0.1:8000; }   # MTIL API (Flask)   — /api/mtil/*
upstream harness  { server 127.0.0.1:3080; }   # dsh web            — rest of /api
# upstream odoo   { server 127.0.0.1:8069; }   # Odoo web (optional)
# upstream odoo_chat { server 127.0.0.1:8072; } # Odoo gevent/websocket (optional)

# Redirect plain HTTP to HTTPS. TLS is REQUIRED in production: the ticket cookie
# is Secure, so it is never sent over http:// (set DSH_TICKET_COOKIE_SECURE=0 in
# the MTIL API ONLY for a throwaway plain-HTTP LAN test).
server {
    listen 80;
    listen [::]:80;
    server_name mtil.example.com;          # <-- your public host
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mtil.example.com;          # <-- your public host

    ssl_certificate     /etc/ssl/mtil/fullchain.pem;   # <-- your cert
    ssl_certificate_key /etc/ssl/mtil/privkey.pem;      # <-- your key

    # Image attachments ride the unary body; keep this at/above the harness
    # `maxRequestBodyBytes` (default ~a few MB of base64). 32m is comfortable.
    client_max_body_size 32m;

    # -- MTIL API: auth gate + ticket mint + session_create ------------------
    # `^~` so this prefix wins outright over the /api block below.
    location ^~ /api/mtil/ {
        proxy_pass http://mtil_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The MTIL session cookie flows in, the Set-Cookie: dsh_ticket flows out;
        # nginx forwards both by default. Do not strip cookies here.
    }

    # -- Harness /api: RPC, /api/respond, WS downlinks, downloads -------------
    location ^~ /api/ {
        proxy_pass http://harness;

        # Trust fence: the harness requires the browser Origin to EQUAL the Host
        # authority it sees, and that Host to be a trusted authority. Forward the
        # PUBLIC host (so Origin===Host holds) and leave the browser Origin
        # untouched (nginx forwards request headers other than Host as-is).
        # -> the harness MUST trust this host: run `dsh web` with
        #    `--trusted-host mtil.example.com` (or trustedHosts in cordis.patch.yml).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket downlinks (events.mux / events.host) + long-lived SSE.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streams must not be buffered or timed out mid-turn.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -- Odoo (optional): login that sets the MTIL cookie + management UI -----
    # Uncomment together with the odoo upstreams above if Odoo is same-origin.
    # location ~ ^/(web|odoo|longpolling)(/|$) {
    #     proxy_pass http://odoo;
    #     proxy_set_header Host              $host;
    #     proxy_set_header X-Real-IP         $remote_addr;
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
    # location ^~ /websocket {                    # Odoo's own gevent websocket
    #     proxy_pass http://odoo_chat;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade    $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host       $host;
    # }

    # -- SPA static (apps/frontend/dist) -------------------------------------
    # Build with `pnpm build` (BASE_PATH=/ since the SPA is served at root).
    location / {
        root  /var/www/mtilai;             # <-- copy apps/frontend/dist here
        index index.html;
        # SPA client routing (/s/:sessionId) falls back to index.html.
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the fingerprinted assets; never cache the HTML shell.
    location /assets/ {
        root       /var/www/mtilai;
        expires    30d;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        root       /var/www/mtilai;
        add_header Cache-Control "no-store";
    }
}
