# =============================================================================
# MTIL AI — nginx on 192.168.11.68, the harness host.
#
# The harness listens on 127.0.0.1:3080 only (the stock web profile bind). This
# nginx is its one network face: it serves the custom SPA dist and proxies the
# harness routes. The gateway 192.168.9.56 terminates TLS and forwards here
# over plain HTTP, keeping the browser Host header. Full procedure:
# docs/MTIL-DEPLOY.md.
#
# Install: copy to /etc/nginx/conf.d/mtil-harness.conf, replace <ODOO_IP>
# (nginx -t refuses the placeholder), then
#   sudo nginx -t && sudo systemctl reload nginx
#
# Firewall (ufw): port 80 only from the gateway, port 8090 only from Odoo:
#   sudo ufw allow from 192.168.9.56 to any port 80 proto tcp
#   sudo ufw allow from <ODOO_IP> to any port 8090 proto tcp
#
# The harness must trust every Host these blocks forward:
#   --trusted-host mtil.mtil.vn --trusted-host mtilai.mtil.mtil.vn
#   --trusted-host 192.168.11.68
# =============================================================================

# WebSocket upgrade helper (http{} scope). Delete this map if another file in
# conf.d already declares $connection_upgrade.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dsh_harness {
    server 127.0.0.1:3080;
}

# -----------------------------------------------------------------------------
# Custom SPA under https://mtil.mtil.vn/mtilai2/ (the gateway forwards only the
# /mtilai2/ prefix here; the rest of mtil.mtil.vn stays on Odoo).
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name mtil.mtil.vn;

    client_max_body_size 64m;

    # Session deep links (/mtilai2/s/<id>): the browser's preload scanner
    # resolves the page's relative ./assets URLs under s/ before the
    # client-computed <base> applies; serve them from the real assets root.
    rewrite ^/mtilai2/s/assets/(.*)$ /mtilai2/assets/$1 last;

    # Static dist written by apps/frontend/deploy/build-mtil.sh
    # (DEST=/var/www/mtilai2). index.html must sit directly in that directory.
    location /mtilai2/ {
        alias /var/www/mtilai2/;
        index index.html;
        try_files $uri $uri/ /mtilai2/index.html;
    }

    # Harness API, prefix-stripped (includes the /api/remote.mux WebSocket and
    # streaming responses).
    location /mtilai2/api/ {
        proxy_pass http://dsh_harness/api/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Client plugin bundles, sourcemaps, and the HMR event stream.
    location /mtilai2/plugins/ {
        proxy_pass http://dsh_harness/plugins/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Token exchange: /mtilai2/dsh-auth?token=… reaches the harness root, which
    # mints the dsh-auth cookie for this Host and answers 303 "./" (the browser
    # resolves it to /mtilai2/); proxy_redirect maps an absolute "/" answer the
    # same way.
    location = /mtilai2/dsh-auth {
        proxy_pass http://dsh_harness/;
        proxy_set_header Host $host;
        proxy_redirect / /mtilai2/;
    }
}

# -----------------------------------------------------------------------------
# Stock harness frontend at https://mtilai.mtil.mtil.vn (optional: delete this
# block and the gateway's matching server to stop publishing it).
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name mtilai.mtil.mtil.vn;

    client_max_body_size 64m;

    location / {
        proxy_pass http://dsh_harness;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

# -----------------------------------------------------------------------------
# Odoo backend calls (Settings → MTIL → Base URL = http://192.168.11.68:8090).
# Server-to-server on the LAN; only the Odoo host may connect.
# -----------------------------------------------------------------------------
server {
    listen 8090;
    server_name 192.168.11.68;

    allow <ODOO_IP>;
    deny all;

    client_max_body_size 64m;

    location / {
        proxy_pass http://dsh_harness;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
